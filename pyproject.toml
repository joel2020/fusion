[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-calling"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "pywinauto>=0.6.9,<1",
  "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
fusion-calling = "fusion_calling.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
